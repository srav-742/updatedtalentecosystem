  <style>
    /* Instant visible fallback so browser paints on the very first frame */
    #root:empty {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #0c0f16;
    }

    .initial-loader {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-bottom-color: #3b82f6;
      border-radius: 50%;
      display: inline-block;
      box-sizing: border-box;
      animation: rotation 1s linear infinite;
    }

    @keyframes rotation {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>

</head>

<body>
  <div id="root">
    <span class="initial-loader" role="status" aria-label="Loading application"></span>
  </div>

  <script type="module" src="/src/main.jsx"></script>

  <!-- Service Worker Registration — only active in production -->
  <script>
    if ('serviceWorker' in navigator) {
      if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
        // Automatically unregister service worker and clear stale SW caches on localhost
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var registration of registrations) {
            registration.unregister();
          }
        });
        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (var name of names) {
              caches.delete(name);
            }
          });
        }
      } else {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function() {});
        });
      }
    }
  </script>

</body>

</html>
